name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: OfficeSuite-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish APK as the "latest" release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk OfficeSuite.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest OfficeSuite.apk \
            --title "Office Suite - latest build" \
            --notes "Debug build of ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. On Android: download OfficeSuite.apk, open it and allow installing apps from this source." \
            --target "$GITHUB_SHA"
